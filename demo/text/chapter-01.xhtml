    <h1>The Lamp Room</h1>
    <p>The stair took ninety-one steps and Mira knew them the way she knew the weather.</p>
    <p>She had been the keeper of this light for eleven winters, and <em>never once</em> had the sea asked her for anything.</p>
    <p>She wrote the log in ink, and <strong>never in pencil</strong>.</p>
