  <body>
    <h1>The Long Dark</h1>
    <p>By midnight the window was a sheet of white and the lamp turned the falling snow into a slow river.</p>
    <p>She trimmed the wick, wound the clock, and stayed — which is the whole of the job, and the whole of the story.</p>
